# canon-inference: embeddings and speech-to-text for canonevent-backend. Shared by local and production; the
# differences live in compose.override.yaml (local, loaded automatically) and compose.prod.yaml (production,
# loaded explicitly).
name: canon-inference

services:
  # Embeddings (bge-m3) and speech-to-text (Sarvam). Called by the Edge Functions with an API key.
  inference:
    build:
      context: .
      args:
        # requirements-local.txt only when EMBED_BACKEND=local (torch inside the image).
        REQUIREMENTS: ${INFERENCE_REQUIREMENTS:-requirements.txt}
    image: memory-inference:latest
    restart: unless-stopped
    # Values come from .env in this directory (Compose reads it automatically). Listed one by one so the
    # container does not also receive the R2 and LLM secrets that only the Edge Functions need.
    environment:
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:?set INFERENCE_API_KEY in .env (copy .env.example)}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      EMBED_BACKEND: ${EMBED_BACKEND:-ollama}
      EMBED_MAX_BATCH: ${EMBED_MAX_BATCH:-64}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_API_URL: ${EMBED_API_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_API_MODEL: ${EMBED_API_MODEL:-}
    # Optional: with no Ollama container (e.g. Ollama runs natively on the host) it is simply skipped.
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    volumes:
      - hf-cache:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # Ollama in a container: `docker compose --profile ollama up`. Skip it if Ollama already runs on the host.
  ollama:
    profiles: [ollama]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  # One-shot: downloads the models into the volume, then exits.
  ollama-init:
    profiles: [ollama]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Space-separated. Production embeds with bge-m3; add the chat model here only if Ollama also serves the LLM.
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-bge-m3}
    entrypoint: [/bin/sh, -c, 'for m in $$OLLAMA_PULL_MODELS; do ollama pull "$$m" || exit 1; done']

volumes:
  hf-cache:
  ollama:
