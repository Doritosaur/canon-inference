# Production overlay. Used explicitly, which also skips compose.override.yaml:
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# Put the production values in .env first (copy .env.prod.example). Supabase itself is the managed service in production,
# so this runs only what the Edge Functions call: the inference service, published on 127.0.0.1:8001 for a
# cloudflared tunnel (or any reverse proxy) to forward. Embeddings come from Workers AI; the Ollama services are
# skipped while COMPOSE_PROFILES is empty.
services:
  inference:
    restart: always
    environment:
      OLLAMA_URL: http://ollama:11434
    # Loopback only: the cloudflared tunnel on the host reaches it here.
    ports:
      - "127.0.0.1:8001:8001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # Enough for the Ollama/API backends; EMBED_BACKEND=local (torch + bge-m3 in-process) needs about 4g.
          memory: ${INFERENCE_MEMORY:-1g}
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ollama:
    restart: always
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY:-3g}
    logging: *logging
